<style>
:root{
  --brand:#0D6174; --brand-dark:#0A4E5D; --brand-soft:#E4F0F2;
  --ink:#1B2A33; --muted:#66737C; --line:#E2E7EA; --line-strong:#C9D1D6; --sunk:#F6F8F9;
  --pend:#A86C12; --pend-soft:#FBF1DC; --danger:#B3242D; --danger-soft:#FBE7E8; --ok:#2E7D4F; --ok-soft:#E3F2E8;
  --font:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:#fff}
body{margin:0;color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.muted{color:var(--muted)}.small{font-size:13px}

.top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top img{height:30px;width:auto;display:block}
.top .app-name{padding-left:16px;border-left:1px solid var(--line);color:var(--muted);font-size:14px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:13px;font-weight:700}
.test{padding:7px 28px;font-size:13px;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}

main{max-width:1080px;margin:0 auto;padding:28px 24px 72px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 18px}
h2{font-size:17px;margin:0 0 12px}

.stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;margin-bottom:26px}
.stat{flex:1 1 200px;padding:16px 20px}
.stat+.stat{border-left:1px solid var(--line)}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat strong{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.stat.main strong{color:var(--brand);font-size:30px}
.stat small{display:block;font-size:13px;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

.btn{appearance:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;border:1px solid var(--line-strong);background:#fff;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.sm{padding:5px 10px;font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer}
.lnk.red{color:var(--danger)}
.lnk:hover{text-decoration:underline}
.wide{width:100%}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.bar .search{flex:1;min-width:220px;max-width:380px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{appearance:none;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip b{font-weight:700;margin-left:2px;opacity:.75}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:0 10px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.code{font-weight:700;color:var(--brand);white-space:nowrap}
.ser{font-size:13px;letter-spacing:.02em;white-space:nowrap}
.acts{display:flex;gap:14px;justify-content:flex-end;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:18px 0;margin:0}
.free{color:var(--muted);font-style:italic}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;white-space:nowrap}
.pill.Nueva{background:var(--ok-soft);color:var(--ok)}
.pill.Buena{background:var(--brand-soft);color:var(--brand)}
.pill.Usada{background:var(--pend-soft);color:var(--pend)}
.pill.Danada{background:var(--danger-soft);color:var(--danger)}
.kind{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:1px 6px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}

.f{display:grid;gap:5px;margin-bottom:14px}
.f>span{font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 12px}
.err:empty{display:none}
.info{border-radius:8px;background:var(--brand-soft);padding:10px 12px;font-size:14px;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;margin-bottom:14px}
.seg button{appearance:none;border:0;background:#fff;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-checked="true"]{background:var(--brand);color:#fff}

.scrim{position:fixed;inset:0;background:rgba(27,42,51,.25);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;border-left:1px solid var(--line);z-index:40;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.open{transform:none;box-shadow:-16px 0 40px rgba(20,40,50,.15)}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0}
.drawer header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.drawer .body{padding:18px 20px;overflow-y:auto;overflow-x:hidden;flex:1}
.drawer footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:5px}
.x:hover{color:var(--ink);background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

.back{margin-bottom:14px}
.acta{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.box{border:1px solid var(--line);border-radius:12px;padding:18px}
.box h2{margin-bottom:4px}
.pick{list-style:none;margin:8px 0 16px;padding:0}
.pick li{border-top:1px solid var(--line)}
.pick label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;cursor:pointer;font-size:14px}
.pick input{width:auto;margin-top:3px;accent-color:var(--brand)}
.pick small{display:block;color:var(--muted);font-size:12px}
.sheet{background:var(--sunk);border-radius:12px;padding:24px;overflow-x:auto}
.paper{background:#fff;width:100%;max-width:680px;min-height:860px;margin:0 auto;padding:48px 52px;box-shadow:0 1px 3px rgba(20,40,50,.12),0 8px 24px rgba(20,40,50,.06);font-family:Arial,Helvetica,sans-serif;color:#111;font-size:12.5px;line-height:1.55}
.paper h3{text-align:center;font-size:17px;margin:0 0 18px}
.paper .fecha{text-align:right;margin-bottom:14px}
.paper .ln{display:inline-block;border-bottom:1px solid #111;padding:0 6px;font-weight:700}
.paper table{font-size:11.5px;margin:12px 0 18px}
.paper th,.paper td{border:1px solid #333;padding:5px 6px;color:#111;font-size:11.5px;white-space:normal}
.paper th{background:#E8E8E8;font-weight:700}
.paper p{margin:0 0 9px;text-align:justify}
.firmas{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:70px}
.firmas div{border-top:1px solid #111;padding-top:6px}
.firmas small{display:block;color:#444}

.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0}
.head-acts{display:flex;gap:8px;align-items:center}
.dd{position:relative}
.dd-pop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:290px;background:#fff;border:1px solid var(--line-strong);border-radius:12px;padding:6px;box-shadow:0 12px 30px rgba(20,40,50,.16)}
.dd.open .dd-pop{display:block}
.dd-pop button{appearance:none;display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:10px 12px;cursor:pointer}
.dd-pop button:hover{background:var(--brand-soft)}
.dd-pop small{display:block;color:var(--muted);font-size:13px}
.who{display:flex;gap:10px;align-items:center}
.eqline{padding:2px 0}
.eqline .pill{margin-left:4px;font-size:11px;padding:1px 8px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:18px 0 8px}
.step:first-of-type{margin-top:4px}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px}
.drawer .pick{max-height:260px;overflow-y:auto;border-bottom:1px solid var(--line)}
@media (max-width:860px){
  .modslot{margin-left:0;order:3;width:100%}.modslot+.right{margin-left:auto}
  .top{padding:12px 16px}.test{padding:7px 16px}
  .top .app-name{display:none}
  main{padding:20px 14px 60px}
  .stat+.stat{border-left:0;border-top:1px solid var(--line)}
  .acta{grid-template-columns:1fr}
  .paper{padding:28px 22px;min-height:0}
  .sheet{padding:12px}
  .two{grid-template-columns:1fr}
  .addrow{flex-direction:column}
  .head-acts{flex-wrap:wrap}
  .head-acts{width:100%}.head-acts .btn{flex:1}
  .dd{flex:1}.dd .btn{width:100%}
}
.pill.Sinrev{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;margin-left:7px;vertical-align:1px}
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--pend-soft);color:#6E4608;border:1px solid #EBD3A1;border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:14px}
.stat.warn strong{color:var(--pend)}
tr.due td{background:#FFFBF2}
tr.due td:first-child{box-shadow:inset 3px 0 0 var(--pend)}
.when{font-size:13px;font-weight:700;color:var(--pend);white-space:nowrap}
.when.soon{color:var(--muted);font-weight:600}
.count{display:inline-block;font-size:13px;font-weight:700;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:0 8px;margin-left:6px;vertical-align:2px}
.dt{position:relative;display:flex;align-items:center}
.dt input[type=text]{padding-right:38px}
.dt-b{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:5px;border-radius:6px;display:grid;place-items:center}
.dt-b:hover{color:var(--brand);background:var(--brand-soft)}
.dt-n{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.pick.dv li{display:flex;align-items:center;gap:10px}
.pick.dv label{flex:1}
.pick.dv select{width:auto;min-width:112px;padding:5px 8px;font-size:13px}
.rev{display:flex;gap:6px;align-items:center}
.rev select{width:auto;min-width:118px;padding:5px 8px}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{background:#951C24}
.addrow{display:flex;gap:8px;max-width:520px;margin-bottom:18px}
.bar-p{height:6px;background:#fff;border-radius:3px;margin:8px 0 6px;overflow:hidden}

.nb{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}

.letras{font-size:12px;color:var(--muted);margin-top:6px;min-height:18px;text-transform:uppercase;letter-spacing:.02em}

.sticky{position:sticky;top:16px}
.boleta{background:#fff;max-width:640px;margin:0 auto;border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(20,40,50,.12),0 8px 24px rgba(20,40,50,.06);font-family:Arial,Helvetica,sans-serif;color:#1B2A33;font-size:11.5px;line-height:1.45}

.cs-popv label input{width:auto}
.cs-popv div{display:flex;gap:8px;justify-content:flex-end}
.cs-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.cs-bar select,.cs-bar input[type=date],.cs-bar input[type=text],.cs-bar input[type=search]{width:auto}
.cs-bar .grow{flex:1;min-width:200px}
.cs-bar .seg{margin:0}
.cs-corte{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.cs-corte b{color:var(--ink);font-weight:600}
.cs-live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(46,125,79,.5);animation:csPulse 2s infinite}
@keyframes csPulse{70%{box-shadow:0 0 0 7px rgba(46,125,79,0)}100%{box-shadow:0 0 0 0 rgba(46,125,79,0)}}
.cs-dist{display:grid;gap:8px}
.cs-dr{display:grid;grid-template-columns:minmax(120px,220px) 1fr 54px;gap:12px;align-items:center;font-size:14px}
.cs-dr .tr{height:9px;background:var(--sunk);border-radius:5px;overflow:hidden}
.cs-dr .fl{height:100%;background:linear-gradient(90deg,var(--brand),#3FA3A8);border-radius:5px}
.cs-dr b{text-align:right;font-weight:600}
.cs-sec{margin:28px 0 0}
.cs-sec>h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cs-sec>h2 small{font-size:13px;font-weight:500;color:var(--muted)}
.cs-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cs-chart{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;min-width:0}
.cs-chart h3{margin:0 0 2px;font-size:15px}
.cs-chart p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.cs-cv{position:relative;height:260px}
.cs-chart.big .cs-cv{height:300px}
.kpi .dl{display:inline-block;font-size:12px;font-weight:700;margin-left:6px;padding:1px 6px;border-radius:6px;vertical-align:3px}
.dl.up{background:var(--ok-soft);color:var(--ok)}.dl.down{background:var(--danger-soft);color:var(--danger)}.dl.eq{background:var(--sunk);color:var(--muted)}
.cs-why{border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:13.5px;color:var(--muted);background:var(--sunk)}
.cs-why p{margin:6px 0}.cs-why b{color:var(--ink)}
.cs-al{display:grid;gap:8px}
.cs-ac{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--line);border-left:4px solid var(--danger);border-radius:10px;padding:12px 14px;background:#fff}
.cs-ac.rep{border-left-color:var(--pend)}
.cs-ac .n{font-size:24px;font-weight:600;text-align:center;line-height:1}
.cs-ac .n small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px}
.cs-up{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.cs-up .box{border:1px solid var(--line);border-radius:12px;padding:14px}
.cs-up textarea{min-height:120px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.cs-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cs-mut{color:var(--muted)}
.cs-ok{color:var(--ok);font-weight:600}.cs-bad{color:var(--danger);font-weight:600}.cs-warn{color:var(--pend);font-weight:600}
.cs-tbar{display:inline-block;height:6px;border-radius:3px;background:var(--brand);vertical-align:middle;margin-right:6px}
.cs-sub{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:-6px 0 18px}
body.wide main{max-width:1560px}
.cs-tb td,.cs-tb th{padding-left:8px;padding-right:8px}
.cs-tb .cs-as{max-width:320px}
.cs-tb th:last-child,.cs-tb td:last-child{position:sticky;right:0;background:#fff;box-shadow:-8px 0 8px -8px rgba(20,40,50,.18)}
.cs-tb tr.cs-chk td:last-child{opacity:1}
@media (max-width:960px){.cs-grid2{grid-template-columns:1fr}.cs-sem{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.cs-sem{grid-template-columns:1fr 1fr}.cs-dr{grid-template-columns:110px 1fr 44px}}
.rp-step{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;background:#fff}
.rp-step h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:10px}
.rp-step h3 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:12.5px}
.rp-step.off{opacity:.55;pointer-events:none}
.rp-list{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.rp-it{display:grid;grid-template-columns:120px 1fr 160px 110px;gap:12px;align-items:center;width:100%;text-align:left;appearance:none;border:0;border-bottom:1px solid var(--line);background:#fff;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.rp-it:last-child{border-bottom:0}.rp-it:hover{background:var(--brand-soft)}
.rp-it small{display:block;color:var(--muted);font-size:12.5px}
.rp-sel{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #B9DDC6;background:var(--ok-soft);border-radius:10px;padding:12px 14px}
.rp-sum{max-width:460px;font-size:13.5px;line-height:1.45;white-space:pre-wrap}
.rp-tag{display:inline-block;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:2px 8px;white-space:nowrap}
.rp-tag.off{background:var(--sunk);color:var(--muted)}
.rp-mx td,.rp-mx th{text-align:center}.rp-mx td:first-child,.rp-mx th:first-child{text-align:left}
.rp-hm{display:inline-block;min-width:30px;padding:2px 6px;border-radius:6px;font-weight:600}
@media (max-width:760px){.rp-it{grid-template-columns:1fr;gap:4px}}
</style>

</head>

/* ---------- acceso a datos (paginado: Supabase entrega máx. 1000 filas por consulta) ---------- */
async function paged(build){const out=[],N=1000;for(let f=0;;f+=N){const{data,error}=await build().range(f,f+N-1);if(error)throw error;out.push(...data);if(data.length<N)break}return out}
async function latestFor(op){
  const{data,error}=await sb.from(T).select('report_date,uploaded_at').eq('operator',op).order('report_date',{ascending:false}).order('uploaded_at',{ascending:false}).limit(1);
  if(error)throw error;return data[0]||null;
}
async function loadLatest(ops){
  // Una sola consulta (función cs_latest en Supabase); si no existe, una por persona.
  const{data,error}=await sb.rpc('cs_latest');
  if(!error){ops.forEach(o=>K.latest[o]=null);data.forEach(r=>{if(ops.includes(r.operator))K.latest[r.operator]={report_date:r.report_date,uploaded_at:r.uploaded_at}});return K.latest}
  const r=await Promise.all(ops.map(latestFor));ops.forEach((o,i)=>K.latest[o]=r[i]);return K.latest;
}
K.snap={};
function snapshot(ops,date){const k=ops.join(',')+'|'+date;return K.snap[k]??=paged(()=>sb.from(T).select('*').in('operator',ops).eq('report_date',date).order('id')).catch(e=>{delete K.snap[k];throw e})}
function resetCache(){K.hist=null;K.histP=null;K.eng=null;K.snap={};EQ_DATES=null}

function engineC(H){if(K.eng&&K.eng.H===H)return K.eng.E;const E=engine(H);K.eng={H,E};return E}
async function loadHist(force){
  if(K.hist&&!force)return K.hist;
  if(K.histP&&!force)return K.histP;
  // Primero pide la primera página y el total; el resto de páginas se pide en paralelo.
  const cols='id,report_date,operator,case_no,poliza,cliente,asunto,clase,fecha,fecha_asignado',N=1000;
  const q=()=>sb.from(T).select(cols).order('report_date').order('id');
  K.histP=(async()=>{
    const first=await sb.from(T).select(cols,{count:'exact'}).order('report_date').order('id').range(0,N-1);
    if(first.error)throw first.error;
    const total=first.count??first.data.length,pages=[];
    for(let f=N;f<total;f+=N)pages.push(f);
    const out=[first.data];
    for(let i=0;i<pages.length;i+=6){
      const r=await Promise.all(pages.slice(i,i+6).map(f=>q().range(f,f+N-1)));
      for(const x of r){if(x.error)throw x.error;out.push(x.data)}
    }
    K.hist=out.flat();K.histP=null;return K.hist;
  })().catch(e=>{K.histP=null;throw e});
  return K.histP;
}
async function datesFor(ops){

}

function tablero(raw,asOf,o){

/* =====================================================================
   ALERTAS: casos que se repiten reporte tras reporte.
   Los "reportes seguidos" cuentan los días con reporte de esa persona
   (fines de semana sin reporte no cortan la racha).
   ===================================================================== */
async function tabAlertas(){
  const H=await loadHist(),E=engineC(H);
  const by={};H.forEach(r=>(by[r.operator+'|'+r.case_no]??=[]).push(r));
  const rie=[],rep=[];
  for(const k in by){
    const s=by[k].sort((a,b)=>a.report_date<b.report_date?-1:1),L=s[s.length-1],op=L.operator;
    if(L.report_date!==E.lastOp[op])continue;
    const ds=E.dOp[op];let pres=1,rs=0;
    for(let i=s.length-1;i>0;i--){if(ds.indexOf(s[i].report_date)-ds.indexOf(s[i-1].report_date)===1)pres++;else break}
    for(let i=s.length-1;i>=0;i--){const e=statusOf(s[i].clase,pISO(s[i].fecha_asignado),pISO(s[i].fecha),pISO(s[i].report_date),op);
      if(e!=='riesgo'&&e!=='urgente')break;if(i<s.length-1&&ds.indexOf(s[i+1].report_date)-ds.indexOf(s[i].report_date)!==1)break;rs++}
    if(rs>=AL.r)rie.push({...L,n:rs});if(pres>=AL.p)rep.push({...L,n:pres});
  }
  rie.sort((a,b)=>b.n-a.n);rep.sort((a,b)=>b.n-a.n);
  const card=(a,cl)=>`<div class="cs-ac ${cl}"><div><div class="cs-cli">${esc(a.cliente)} ${opB(a.operator)}</div><div class="cs-as">Caso ${esc(a.case_no)} · ${esc(a.poliza)} · ${esc(a.clase)}</div></div><div class="n">${a.n}<small>reportes seguidos</small></div></div>`;
  $('cs-body').innerHTML=`<div class="cs-bar"><label class="small">En riesgo o urgente por <input type="number" min="1" max="60" value="${AL.r}" style="width:70px" onchange="AL.r=Math.max(1,+this.value||2);tabAlertas()"> reportes seguidos</label>
    <label class="small">Sin cerrarse por <input type="number" min="1" max="120" value="${AL.p}" style="width:70px" onchange="AL.p=Math.max(1,+this.value||5);tabAlertas()"> reportes seguidos</label></div>
   <div class="cs-grid2"><section><h2>En riesgo repetido <small class="cs-mut">(${rie.length})</small></h2><div class="cs-al">${rie.length?rie.map(a=>card(a,'')).join(''):'<p class="empty">Sin casos en riesgo repetido.</p>'}</div></section>
   <section><h2>Repetidos sin cerrar <small class="cs-mut">(${rep.length})</small></h2><div class="cs-al">${rep.length?rep.map(a=>card(a,'rep')).join(''):'<p class="empty">Sin casos repetidos.</p>'}</div></section></div>`;
}

/* =====================================================================
   CARGAR DATOS (respaldo manual si falla la automatización)
   ===================================================================== */
function csvLine(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){o.push(c);c=''}else c+=ch}o.push(c);return o}
function parseTxt(txt,op,date){
  const ls=txt.split(/\r?\n/).filter(l=>l.trim());if(ls.length<2)return[];
  const h=csvLine(ls[0]).map(x=>x.trim().toUpperCase()),ix=n=>h.indexOf(n);
  const sl=s=>{const m=String(s||'').trim().match(/^(\d{4})\/(\d{2})\/(\d{2})$/);return m?`${m[1]}-${m[2]}-${m[3]}`:null};
  return ls.slice(1).map(l=>{const f=csvLine(l),g=n=>{const i=ix(n);return i>=0?(f[i]||'').trim():''};
    return{report_date:date,operator:op,case_no:g('NO.')||g('NO'),poliza:g('POLIZA'),cliente:g('CLIENTE'),asunto:g('ASUNTO'),clase:g('CLASE'),fecha:sl(g('FECHA')),fecha_asignado:sl(g('FECHA ASIGNADO'))}}).filter(r=>r.poliza||r.cliente);
}

  $('cs-body').innerHTML=`<div class="info">Úsalo solo si la automatización del servidor falla. Para cada persona, elige su .txt exportado de SISEG o pega el contenido. Se reemplazan los casos de <b>hoy</b> de esa persona.</div>
   <div class="cs-up">${OPS.map(o=>`<div class="box"><h3 style="margin:0 0 8px">${opB(o)}</h3><input type="file" accept=".txt,.csv" onchange="leerTxt(this,'${o}')" style="margin-bottom:8px"><textarea id="tx-${o}" placeholder="Pega aquí el .txt de ${OPN[o]}"></textarea></div>`).join('')}</div>
   <div class="cs-bar" style="margin-top:16px"><button class="btn primary" id="upb" onclick="subir()">Subir a Supabase</button><span id="ups" class="small muted"></span></div>`;
}
function leerTxt(inp,o){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$('tx-'+o).value=r.result;r.readAsText(f,'utf-8')}
async function subir(){
  const date=hoyISO(),b=$('upb'),s=$('ups');b.disabled=true;let tot=0;
  try{for(const o of OPS){const t=$('tx-'+o).value.trim();if(!t)continue;const rows=parseTxt(t,o,date);
      s.textContent=`Subiendo ${OPN[o]}…`;
      let r=await sb.from(T).delete().eq('report_date',date).eq('operator',o);if(r.error)throw r.error;
      if(rows.length){r=await sb.from(T).upsert(rows,{onConflict:'report_date,operator,case_no'});if(r.error)throw r.error}
      tot+=rows.length}
    if(!tot){s.textContent='No hay datos para subir.';b.disabled=false;return}
    s.textContent=`Listo: ${tot} casos subidos.`;toast('Datos subidos.');resetCache();await loadLatest(OPS);
  }catch(e){s.textContent='Error: '+e.message}
  b.disabled=false;
}

  const qi=$('rp-q');if(qi&&document.activeElement!==qi&&F.q){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}
}
let rpT;function rpFormDeb(){clearTimeout(rpT);rpT=setTimeout(()=>{rpForm();const qi=$('rp-q');if(qi){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}},250)}
let RP_CAND=[];
function rpPick(i){const c=RP_CAND[i];RP.f.caso={no:c.no,poliza:c.poliza,cliente:c.cliente,clase:c.clase,asunto:c.asunto,fa:c.faI||null};rpForm()}
function rpManual(){const no=$('mn-no').value.trim();if(!no){toast('Escribe el número de caso.');return}RP.f.caso={no,poliza:$('mn-po').value.trim(),cliente:$('mn-cl').value.trim(),clase:'',asunto:'',fa:null};rpForm()}
async function rpGuardar(){
  const F=RP.f;if(!F?.op||!F.caso){toast('Elige la persona y el caso.');return}
  if(!F.tipo){toast('Elige el tipo de reproceso.');return}
  if(!F.resumen.trim()){toast('Escribe el resumen de lo que pasó.');return}
  const t=RPD.tipos.find(x=>String(x.id)===String(F.tipo));
  const row={operator:F.op,case_no:F.caso.no,poliza:F.caso.poliza||null,cliente:F.caso.cliente||null,clase:F.caso.clase||null,asunto:F.caso.asunto||null,fecha_asignado:F.caso.fa||null,tipo_id:t.id,tipo_nombre:t.nombre,fecha:F.fecha||hoyISO(),resumen:F.resumen.trim()};
  $('rp-save').disabled=true;
  const r=F.id?await sb.from('reprocesos').update({...row,updated_at:new Date().toISOString()}).eq('id',F.id):await sb.from('reprocesos').insert(row);
  if(r.error){toast('No se pudo guardar: '+r.error.message);$('rp-save').disabled=false;return}
  toast(F.id?'Reproceso actualizado.':'Reproceso guardado.');RPD.regs=null;RP.f=null;RP.tab='registros';render();
}

/* ---------- registros ---------- */
async function rpRegistros(){
  await rpTipos();const R=await rpRegs(),q=RP.q.trim().toLowerCase();
  const L=R.filter(r=>(RP.quien==='all'||r.operator===RP.quien)&&(!RP.tipo||String(r.tipo_id)===RP.tipo)&&(!q||`${r.case_no} ${r.cliente} ${r.poliza} ${r.resumen}`.toLowerCase().includes(q)));
  $('rp-body').innerHTML=`${rpFiltros(false)}
   <div class="tbl"><table class="cs-tb"><thead><tr><th>Fecha</th><th>Persona</th><th>Caso</th><th>Tipo</th><th>Resumen</th><th>Registró</th><th></th></tr></thead><tbody>
   ${L.length?L.map(r=>`<tr><td class="cs-mono">${fDs(r.fecha)}</td><td>${opB(r.operator)}</td><td><div class="cs-cli">${esc(r.cliente||'—')}</div><div class="cs-as">Caso ${esc(r.case_no)} · ${esc(r.poliza||'')}</div></td><td><span class="rp-tag">${esc(rpTipoN(r))}</span></td><td><div class="rp-sum">${esc(r.resumen)}</div></td><td class="small cs-mut">${esc((r.created_by||'').split('@')[0])}</td>
     <td><div class="acts"><button class="lnk" onclick="rpEditar(${r.id})">Editar</button><button class="lnk red" onclick="rpBorrar(${r.id})">Eliminar</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No hay reprocesos que coincidan.</td></tr>'}
   </tbody></table></div><p class="small muted">${plural(L.length,'reproceso','reprocesos')}</p>`;
}
function rpFiltros(periodo){
  const tipos=RPD.tipos||[];
  const per=[['7','7 días'],['30','30 días'],['90','90 días'],['mes','Este mes'],['mesant','Mes pasado'],['trim','Trimestre'],['anio','Este año'],['todo','Todo'],['custom','Fechas…']];
  const go=periodo?'rpResumen()':'rpRegistros()';
  return`${periodo?`<div class="cs-bar"><div class="seg" role="radiogroup" aria-label="Período">${per.map(([k,l])=>`<button role="radio" aria-checked="${RP.per===k}" onclick="RP.per='${k}';rpResumen()">${l}</button>`).join('')}</div>
     ${RP.per==='custom'?(()=>{const R=rango(null,RP);return`<input type="date" value="${R.f}" onchange="RP.desde=this.value;rpResumen()" aria-label="Desde"><span class="cs-mut">a</span><input type="date" value="${R.t}" onchange="RP.hasta=this.value;rpResumen()" aria-label="Hasta">`})():''}</div>`:''}
   <div class="cs-bar"><div class="chips" style="margin:0">${[['all','Todos'],...OPS.map(o=>[o,OPN[o]])].map(([k,l])=>`<button class="chip" aria-pressed="${RP.quien===k}" onclick="RP.quien='${k}';${go}">${l}</button>`).join('')}</div>
    <select onchange="RP.tipo=this.value;${go}" aria-label="Tipo"><option value="">Todos los tipos</option>${tipos.map(t=>`<option value="${t.id}" ${RP.tipo===String(t.id)?'selected':''}>${esc(t.nombre)}</option>`).join('')}</select>
    ${periodo?`<button class="btn sm" style="margin-left:auto" onclick="rpCSV()">Descargar (CSV)</button>`:`<input type="search" class="grow" placeholder="Buscar caso, cliente, póliza o texto del resumen" value="${esc(RP.q)}" oninput="RP.q=this.value;clearTimeout(rpT);rpT=setTimeout(()=>{rpRegistros();const i=document.querySelector('#rp-body input[type=search]');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)">`}</div>`;
}
async function rpEditar(id){
  const r=RPD.regs.find(x=>x.id===id);if(!r)return;
  RP.f={id,op:r.operator,caso:{no:r.case_no,poliza:r.poliza,cliente:r.cliente,clase:r.clase,asunto:r.asunto,fa:r.fecha_asignado},q:'',manual:false,tipo:String(r.tipo_id||''),fecha:r.fecha,resumen:r.resumen};
  RP.tab='nuevo';render();
}
async function rpBorrar(id){
  if(!confirm('¿Eliminar este reproceso? No se puede deshacer.'))return;
  const{error}=await sb.from('reprocesos').delete().eq('id',id);
  if(error){toast('No se pudo eliminar: '+error.message);return}
  RPD.regs=null;toast('Reproceso eliminado.');rpRegistros();
}

/* ---------- tipos ---------- */
async function rpTiposTab(){
  const T2=await rpTipos(true),R=await rpRegs(),uso={};R.forEach(r=>uso[r.tipo_id]=(uso[r.tipo_id]||0)+1);
  $('rp-body').innerHTML=`<div class="info">Estos son los tipos que aparecen al registrar un reproceso. Si quitas uno que ya tiene registros, deja de aparecer para casos nuevos pero se conserva en el historial y en el resumen.</div>
   <div class="cs-bar"><input id="nt-n" placeholder="Nombre del tipo (ej.: Póliza emitida con datos incorrectos)" class="grow"><input id="nt-d" placeholder="Descripción (opcional)" class="grow"><button class="btn primary" onclick="rpTipoAdd()">Agregar tipo</button></div>
   <div class="tbl"><table><thead><tr><th>Tipo</th><th>Descripción</th><th class="cs-num">Registros</th><th>Estado</th><th></th></tr></thead><tbody>
   ${T2.length?T2.map(t=>`<tr><td><input value="${esc(t.nombre)}" id="tn-${t.id}"></td><td><input value="${esc(t.descripcion||'')}" id="td-${t.id}"></td><td class="cs-num">${uso[t.id]||0}</td><td>${t.activo?'<span class="rp-tag">Activo</span>':'<span class="rp-tag off">Quitado</span>'}</td>
     <td><div class="acts"><button class="lnk" onclick="rpTipoSave(${t.id})">Guardar</button>${t.activo?`<button class="lnk red" onclick="rpTipoAct(${t.id},false,${uso[t.id]||0})">Quitar</button>`:`<button class="lnk" onclick="rpTipoAct(${t.id},true)">Volver a activar</button>`}</div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Todavía no hay tipos. Agrega el primero arriba.</td></tr>'}
   </tbody></table></div>`;
}
async function rpTipoAdd(){
  const nombre=$('nt-n').value.trim(),descripcion=$('nt-d').value.trim()||null;if(!nombre){toast('Escribe el nombre del tipo.');return}
  const{error}=await sb.from('reproceso_tipos').insert({nombre,descripcion});
  if(error){toast(error.code==='23505'?'Ya existe un tipo con ese nombre.':'No se pudo agregar: '+error.message);return}
  toast('Tipo agregado.');rpTiposTab();
}
async function rpTipoSave(id){
  const nombre=$('tn-'+id).value.trim(),descripcion=$('td-'+id).value.trim()||null;if(!nombre){toast('El nombre no puede quedar vacío.');return}
  const{error}=await sb.from('reproceso_tipos').update({nombre,descripcion}).eq('id',id);
  toast(error?(error.code==='23505'?'Ya existe un tipo con ese nombre.':'No se pudo guardar: '+error.message):'Tipo actualizado.');
}
async function rpTipoAct(id,on,uso){
  if(!on&&!uso){if(!confirm('Este tipo no tiene registros. ¿Eliminarlo por completo?'))return;const{error}=await sb.from('reproceso_tipos').delete().eq('id',id);if(error){toast('No se pudo eliminar: '+error.message);return}toast('Tipo eliminado.');return rpTiposTab()}
  const{error}=await sb.from('reproceso_tipos').update({activo:on}).eq('id',id);
  if(error){toast('No se pudo cambiar: '+error.message);return}toast(on?'Tipo activado de nuevo.':'Tipo quitado. Se conserva en el historial.');rpTiposTab();
}

/* ---------- resumen / dashboard ---------- */
async function rpResumen(){
  const chP=needChart();
  const[,all,H]=await Promise.all([rpTipos(),rpRegs(),loadHist()]),E=engineC(H);
  Object.values(K.charts).forEach(c=>c.destroy());K.charts={};
  const R=rango(all.length?all[all.length-1].fecha:null,RP);
  const ops=RP.quien==='all'?OPS:[RP.quien];
  const fil=(f,t)=>all.filter(r=>r.fecha>=f&&r.fecha<=t&&ops.includes(r.operator)&&(!RP.tipo||String(r.tipo_id)===RP.tipo));
  const L=fil(R.f,R.t),LP=fil(R.pf,R.pt);
  const cerr=E.cases.filter(c=>ops.includes(c.op)&&!c.open&&c.close&&c.close>=R.f&&c.close<=R.t).length;
  const casosAf=new Set(L.map(r=>r.operator+'|'+r.case_no)).size;
  const cnt=(arr,key)=>{const m={};arr.forEach(r=>{const k=key(r);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const porTipo=cnt(L,rpTipoN),porOp=cnt(L,r=>r.operator),porCls=cnt(L,r=>r.clase||'(SIN CLASE)');
  const porCaso=cnt(all.filter(r=>ops.includes(r.operator)),r=>r.operator+'|'+r.case_no).filter(x=>x[1]>1);
  const tasa=cerr?L.length/cerr*100:null;
  $('rp-body').innerHTML=`${rpFiltros(true)}
   <div class="kpis">
    <div class="kpi main"><span>Reprocesos</span><strong>${L.length}${delta(L.length,LP.length,false)}</strong><small class="muted">${fDs(R.f)} al ${fDs(R.t)}</small></div>
    <div class="kpi"><span>Casos afectados</span><strong>${casosAf}</strong><small class="muted">${L.length>casosAf?`${L.length-casosAf} reproceso${L.length-casosAf===1?'':'s'} repetido${L.length-casosAf===1?'':'s'} en el mismo caso`:'Ningún caso se repitió'}</small></div>
    <div class="kpi ${tasa!==null&&tasa>=10?'warn':''}"><span>Por cada 100 casos cerrados</span><strong>${tasa===null?'—':f1(tasa)}</strong><small class="muted">${cerr} casos cerrados en el período</small></div>
    <div class="kpi"><span>Tipo más frecuente</span><strong style="font-size:17px;line-height:1.3">${porTipo[0]?esc(porTipo[0][0]):'—'}</strong><small class="muted">${porTipo[0]?plural(porTipo[0][1],'vez','veces'):''}</small></div>
    <div class="kpi"><span>Persona con más reprocesos</span><strong style="font-size:17px">${porOp[0]?OPN[porOp[0][0]]:'—'}</strong><small class="muted">${porOp[0]?plural(porOp[0][1],'reproceso','reprocesos'):''}</small></div>
   </div>
   <div class="cs-grid2">
    <div class="cs-chart"><h3>Por tipo</h3><p>Qué errores se repiten más.</p><div class="cs-cv"><canvas id="rc1"></canvas></div></div>
    <div class="cs-chart"><h3>Por persona</h3><p>Reprocesos y casos cerrados de cada persona en el período.</p><div class="cs-cv"><canvas id="rc2"></canvas></div></div>
    <div class="cs-chart"><h3>Por semana</h3><p>Cómo evoluciona la cantidad de reprocesos.</p><div class="cs-cv"><canvas id="rc3"></canvas></div></div>
    <div class="cs-chart"><h3>Por clase de caso</h3><p>En qué tipo de trámite ocurren.</p><div class="cs-cv"><canvas id="rc4"></canvas></div></div>
   </div>
   <section class="cs-sec"><h2>Persona por tipo</h2><div class="tbl" id="rp-mx"></div></section>
   <section class="cs-sec"><h2>Casos con más de un reproceso <small>histórico completo</small></h2><div class="tbl" id="rp-rep"></div></section>
   <section class="cs-sec"><h2>Últimos reprocesos del período</h2><div class="tbl" id="rp-last"></div></section>`;
  window.__rpL=L;window.__rpR=R;
  const tiposU=porTipo.map(x=>x[0]),mx=Math.max(1,...ops.flatMap(o=>tiposU.map(t=>L.filter(r=>r.operator===o&&rpTipoN(r)===t).length)));
  const hm=n=>n?`<span class="rp-hm" style="background:rgba(179,36,45,${.08+.5*n/mx});color:${n/mx>.6?'#fff':'#7A1A20'}">${n}</span>`:'<span class="cs-mut">·</span>';
  $('rp-mx').innerHTML=L.length?`<table class="rp-mx"><thead><tr><th>Tipo</th>${ops.map(o=>`<th>${opB(o)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${tiposU.map(t=>`<tr><td>${esc(t)}</td>${ops.map(o=>`<td>${hm(L.filter(r=>r.operator===o&&rpTipoN(r)===t).length)}</td>`).join('')}<td><b>${L.filter(r=>rpTipoN(r)===t).length}</b></td></tr>`).join('')}
    <tr style="background:var(--sunk);font-weight:600"><td>Total</td>${ops.map(o=>`<td>${L.filter(r=>r.operator===o).length}</td>`).join('')}<td>${L.length}</td></tr></tbody></table>`:'<p class="empty">Sin reprocesos en el período.</p>';
  $('rp-rep').innerHTML=porCaso.length?`<table><thead><tr><th>Caso</th><th>Persona</th><th class="cs-num">Reprocesos</th><th>Tipos</th><th>Último</th></tr></thead><tbody>${porCaso.slice(0,15).map(([k,n])=>{const rs=all.filter(r=>r.operator+'|'+r.case_no===k),r0=rs[0];return`<tr><td><div class="cs-cli">${esc(r0.cliente||'—')}</div><div class="cs-as">Caso ${esc(r0.case_no)} · ${esc(r0.poliza||'')}</div></td><td>${opB(r0.operator)}</td><td class="cs-num cs-bad">${n}</td><td>${[...new Set(rs.map(rpTipoN))].map(t=>`<span class="rp-tag">${esc(t)}</span>`).join(' ')}</td><td class="cs-mono">${fDs(r0.fecha)}</td></tr>`}).join('')}</tbody></table>`:'<p class="empty">Ningún caso tiene más de un reproceso.</p>';
  $('rp-last').innerHTML=L.length?`<table class="cs-tb"><thead><tr><th>Fecha</th><th>Persona</th><th>Caso</th><th>Tipo</th><th>Resumen</th></tr></thead><tbody>${L.slice(0,10).map(r=>`<tr><td class="cs-mono">${fDs(r.fecha)}</td><td>${opB(r.operator)}</td><td><div class="cs-cli">${esc(r.cliente||'—')}</div><div class="cs-as">Caso ${esc(r.case_no)}</div></td><td><span class="rp-tag">${esc(rpTipoN(r))}</span></td><td><div class="rp-sum">${esc(r.resumen)}</div></td></tr>`).join('')}</tbody></table>${L.length>10?`<p class="small"><button class="lnk" onclick="rpTab('registros')">Ver los ${L.length} registros</button></p>`:''}`:'<p class="empty">Sin reprocesos en el período.</p>';
  await chP;if(!window.Chart)return;
  Chart.defaults.font.family='"Instrument Sans","Segoe UI",system-ui,sans-serif';Chart.defaults.color='#66737C';
  const hb=(id,pairs,color)=>chart(id,{type:'bar',data:{labels:pairs.map(p=>p[0].length>34?p[0].slice(0,32)+'…':p[0]),datasets:[{label:'Reprocesos',data:pairs.map(p=>p[1]),backgroundColor:color,borderRadius:4}]},options:baseOpts(false,{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0},grid:{color:'#EEF1F3'}},y:{grid:{display:false}}}})});
  hb('rc1',porTipo.slice(0,10),'#B3242D');
  const cerrOp=o=>E.cases.filter(c=>c.op===o&&!c.open&&c.close&&c.close>=R.f&&c.close<=R.t).length;
  chart('rc2',{type:'bar',data:{labels:ops.map(o=>OPN[o]),datasets:[{label:'Reprocesos',data:ops.map(o=>L.filter(r=>r.operator===o).length),backgroundColor:ops.map(o=>OPC[o]),borderRadius:4},{label:'Casos cerrados',data:ops.map(cerrOp),backgroundColor:'#D5DEE2',borderRadius:4}]},options:baseOpts(false)});
  const wks=[...new Set(L.map(r=>wkKey(r.fecha)))].sort();
  chart('rc3',{type:'bar',data:{labels:wks.map(w=>{const x=pISO(w);return`Sem. ${x.getDate()}/${x.getMonth()+1}`}),datasets:ops.map(o=>({label:OPN[o],data:wks.map(w=>L.filter(r=>r.operator===o&&wkKey(r.fecha)===w).length),backgroundColor:OPC[o],borderRadius:4}))},options:baseOpts(true)});
  hb('rc4',porCls.slice(0,10),'#0D6174');
}
function rpCSV(){
  const L=window.__rpL||[];if(!L.length){toast('No hay reprocesos en el período.');return}
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const lines=[['Fecha','Persona','No. caso','Póliza','Cliente','Clase','Asunto','Fecha asignado','Tipo','Resumen','Registró'].map(q).join(',')];
  L.forEach(r=>lines.push([fDs(r.fecha),OPN[r.operator],r.case_no,r.poliza,r.cliente,r.clase,r.asunto,r.fecha_asignado?fDs(r.fecha_asignado):'',rpTipoN(r),r.resumen,r.created_by].map(q).join(',')));
  const b=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=`reprocesos_${window.__rpR.f}_${window.__rpR.t}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function homeReproc(){
  if(!G.admin)return;

  const el=document.createElement('article');el.className='mod';el.style.cssText='--m1:#8A2A35;--m2:#C2457F';

    <span class="mod-go">Abrir <span aria-hidden="true">→</span></span></button>
   <div class="mod-lk"><button onclick="rpNuevo()">Agregar reproceso</button><button onclick="RP.tab='registros';irMod('reproc')">Registros</button><button onclick="RP.tab='tipos';irMod('reproc')">Tipos</button></div>`;
